name: Daily News & Price Log
on:
  schedule:
    - cron: '30 3 * * 1-6'  # 3:30 AM UTC Monday-Saturday (no Sunday runs)
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Bitcoin price
        id: bitcoin
        run: |
          BTC_PRICE=$(curl -s https://api.coindesk.com/v1/bpi/currentprice/USD.json | jq '.bpi.USD.rate_float' | cut -d'.' -f1)
          echo "price=$BTC_PRICE" >> $GITHUB_OUTPUT

      - name: Get yesterday's date
        id: date
        run: |
          YESTERDAY=$(date -d 'yesterday' '+%B %d, %Y')
          echo "yesterday=$YESTERDAY" >> $GITHUB_OUTPUT

      - name: Fetch top world news headline
        id: news
        run: |
          NEWS_RESPONSE=$(curl -s "https://newsapi.org/v2/top-headlines?category=general&sortBy=publishedAt&pageSize=1&apiKey=${{ secrets.NEWS_API_KEY }}")
          HEADLINE=$(echo "$NEWS_RESPONSE" | jq -r '.articles[0].title // "Unable to fetch headline"')
          SOURCE=$(echo "$NEWS_RESPONSE" | jq -r '.articles[0].source.name // "Unknown"')
          echo "headline=$HEADLINE" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT

      - name: Update daily_log.txt
        run: |
          cat >> daily_log.txt << 'EOF'
          ${{ steps.date.outputs.yesterday }} - Top world news: ${{ steps.news.outputs.headline }} (Source: ${{ steps.news.outputs.source }})
          ${{ steps.date.outputs.yesterday }} - Bitcoin Price: $${{ steps.bitcoin.outputs.price }}+ (up from previous day)
          EOF

      - name: Commit and push to main
        run: |
          git config user.name "dmoney25632"
          git config user.email "dayton.runyan@hotmail.com"
          git add daily_log.txt
          git commit -m "Daily update: ${{ steps.date.outputs.yesterday }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
